<!doctype html>
<html lang="es">
<head>
  {% include blog-head.html %}
</head>
<body>
  {% include blog-nav.html %}
  <main class="page">
    <div class="wrap">
      <div class="listing">
        <p class="kicker">Notas</p>
        <h1>{{ page.title }}</h1>
        {{ content }}
        <ul class="post-list">
          {% for post in site.posts %}
          <li>
            <a href="{{ post.url }}">
              <h2>{{ post.title }}</h2>
              <p>{{ post.description }}</p>
            </a>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </main>
  {% include blog-footer.html %}
</body>
</html>
